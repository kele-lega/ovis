name: SSH bootstrap scripts

on:
  pull_request:
    paths:
      - 'scripts/bootstrap/**'
      - 'server/bootstrap-assets.ts'
      - '.github/workflows/ssh-bootstrap.yml'
      - '.gitattributes'
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap/**'
      - 'server/bootstrap-assets.ts'
      - '.github/workflows/ssh-bootstrap.yml'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the immutable bootstrap-v1 assets after all validation passes'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ssh-bootstrap-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Native parser, pure validation and isolated mocked bootstrap tests
        shell: pwsh
        env:
          OVIS_REQUIRE_POWERSHELL: '1'
        run: |
          bun test ./scripts/bootstrap/bootstrap.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact LF artifact bytes and generate SHA-256 manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bootstrap-artifacts | Out-Null
          $sums = @()
          foreach ($name in @('ovis-bootstrap.sh', 'ovis-bootstrap.ps1')) {
            $path = Join-Path scripts/bootstrap $name
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            if ($bytes.Length -eq 0 -or $bytes -contains 13 -or $bytes[0] -eq 239) { throw "Artifact must be nonempty UTF-8 without BOM and with LF only: $name" }
            Copy-Item -LiteralPath $path -Destination bootstrap-artifacts
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $sums += "$hash  $name"
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'bootstrap-artifacts/SHA256SUMS'), (($sums -join "`n") + "`n"), (New-Object Text.UTF8Encoding($false)))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-bootstrap-${{ matrix.os }}
          path: bootstrap-artifacts/
          if-no-files-found: error

  publish:
    name: Manually publish immutable bootstrap-v1
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ssh-bootstrap-*
          path: validated
      - name: Require identical validated artifacts on all platforms
        shell: bash
        run: |
          set -euo pipefail
          for os in ubuntu-24.04 macos-14 windows-2022; do
            (cd "validated/ssh-bootstrap-$os" && sha256sum --check SHA256SUMS)
            for file in ovis-bootstrap.sh ovis-bootstrap.ps1 SHA256SUMS; do
              cmp "validated/ssh-bootstrap-ubuntu-24.04/$file" "validated/ssh-bootstrap-$os/$file"
            done
          done
          cmp scripts/bootstrap/ovis-bootstrap.sh validated/ssh-bootstrap-ubuntu-24.04/ovis-bootstrap.sh
          cmp scripts/bootstrap/ovis-bootstrap.ps1 validated/ssh-bootstrap-ubuntu-24.04/ovis-bootstrap.ps1
      - name: Refuse existing tag or release; publish without overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A successful list request also proves API/auth access; no ambiguous
          # `gh ... view` failure is ever interpreted as permission to overwrite.
          tags=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/bootstrap-v1" --jq '.[].ref')
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')
          if printf '%s\n' "$tags" | grep -Fxq 'refs/tags/bootstrap-v1' || printf '%s\n' "$releases" | grep -Fxq 'bootstrap-v1'; then
            printf '%s\n' 'bootstrap-v1 already exists; published bootstrap artifacts are immutable. Refusing tag/release/asset overwrite.' >&2
            exit 1
          fi
          gh release create bootstrap-v1 \
            --target "$VALIDATED_SHA" \
            --title 'Ovis SSH bootstrap v1' \
            --notes 'Standalone owner-run SSH bootstrap scripts. SHA256SUMS contains the exact LF artifact hashes validated on Linux, macOS and Windows. Verify the hash before execution. SSH host fingerprint verification and deployment approval remain manual. Linux requires a manually reviewed running OpenSSH service; macOS requires Remote Login configured in System Settings. Installed SSH authorization does not expire automatically; use the original command with --remove / -Remove to clean up.' \
            --latest=false \
            validated/ssh-bootstrap-ubuntu-24.04/ovis-bootstrap.sh \
            validated/ssh-bootstrap-ubuntu-24.04/ovis-bootstrap.ps1 \
            validated/ssh-bootstrap-ubuntu-24.04/SHA256SUMS
